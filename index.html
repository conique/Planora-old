<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111316">
    <title>Planora — Projetos</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script>try{if(localStorage.getItem('Planora_tema')==='claro'){document.documentElement.dataset.tema='claro';document.querySelector('meta[name="theme-color"]').content='#f3f5f9'}}catch(e){}</script>
    <link rel="stylesheet" href="css/main.css?v=20261114-nc2">
</head>

<body>

<header class="topo" id="topo" data-atual="" data-filtros="true"></header>
<script src="js/layout/header.js?v=20261114-nc2"></script>


<div id="estado-vazio" style="display:none;">

    <div class="icone-vazio">
        📁
    </div>

    <div class="texto-vazio">
        Nenhum projeto encontrado.
    </div>

    <button
        class="btn-criar-destaque"
        onclick="abrirModal()"
    >
        + Nova Página
    </button>

</div>

<div class="filtros-tabela" id="barra-filtros" role="group" aria-label="Filtros" hidden>
    <div class="filtros-tabela-intro">
        <button type="button" class="btn-limpar-filtros" onclick="limparFiltrosTabela()">Limpar filtros</button>
    </div>
    <div class="filtro-tabela-campo filtro-tabela-grupo" id="filtro-tag"></div>
    <div class="filtro-tabela-campo filtro-tabela-grupo" id="filtro-rotulo"></div>
    <div class="filtro-tabela-campo filtro-tabela-grupo" id="filtro-area"></div>
</div>

<div class="kanban" id="kanban" hidden></div>

<div id="conteudo-tabela" style="display:none;">
    <div class="barra-ordem" id="barra-ordem"></div>

    <div class="tabela-rolagem">
    <table>

        <thead>

            <tr>

                <th
                    class="cabecalho-clicavel"
                    onclick="ordenarPor('nome')"
                >
                    Aa Título
                </th>

                <th
                    class="cabecalho-clicavel"
                    onclick="ordenarPor('rotulo')"
                >
                    ◫ Rótulo
                </th>

                <th
                    class="cabecalho-clicavel"
                    onclick="ordenarPor('area')"
                >
                    ○ Área
                </th>

                <th
                    class="cabecalho-clicavel"
                    onclick="ordenarPor('prazo')"
                >
                    📅 Prazo
                </th>

                <th style="width:50px;"></th>

            </tr>

        </thead>

        <tbody id="corpo-tabela"></tbody>

    </table>
    </div>

</div>


<div
    class="modal-overlay"
    id="modalNovaPagina"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2>
                Nova Página
            </h2>

            <button
                class="btn-fechar"
                onclick="fecharModal()"
            >
                ×
            </button>

        </div>


        <div class="tipo-selecao" id="tipo-selecao-areas"></div>


        <input
            id="nomePagina"
            class="input-texto"
            type="text"
            placeholder="Título (Ex: Revisão de planilhas)"
        >


        <button
            class="btn-salvar"
            onclick="salvarNovoProjeto()"
        >
            Criar ↵
        </button>

    </div>

</div>

<div class="modal-overlay" id="modalEditarKanban" onclick="if(event.target === this) fecharEdicaoKanban()">
    <form class="modal-card modal-editar-kanban" onsubmit="salvarEdicaoKanban(event)">
        <div class="modal-header">
            <h2>Editar item</h2>
            <button type="button" class="btn-fechar" onclick="fecharEdicaoKanban()" aria-label="Fechar">×</button>
        </div>
        <label class="campo-editar-kanban" for="kanban-edit-nome">Título</label>
        <input id="kanban-edit-nome" class="input-inline-tabela campo-editar-input" type="text" required>
        <label class="campo-editar-kanban" for="kanban-edit-rotulo">Rótulo</label>
        <select id="kanban-edit-rotulo" class="select-inline-tabela campo-editar-input"></select>
        <label class="campo-editar-kanban" for="kanban-edit-area">Área</label>
        <select id="kanban-edit-area" class="select-inline-tabela campo-editar-input"></select>
        <label class="campo-editar-kanban" for="kanban-edit-prazo">Prazo</label>
        <input id="kanban-edit-prazo" class="input-inline-tabela campo-editar-input" type="date">
        <div class="acoes-editar-kanban">
            <button type="button" class="btn-cancelar-edicao" onclick="fecharEdicaoKanban()">Cancelar</button>
            <button type="submit" class="btn-salvar-inline">Salvar</button>
        </div>
    </form>
</div>




<footer class="footer-Planora">
    <span class="ponto"></span><strong>Planora</strong><span>© 2026</span>
    <span id="status-nuvem" class="status-nuvem" role="img" aria-label="Status da nuvem"></span>
    <span id="email-usuario" class="email-usuario"></span>
    <button type="button" class="btn-rodape" onclick="sairDaConta()">Sair</button>
</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config/supabase.config.js"></script>
    <script src="js/core/storage.js?v=20261114-nc1"></script>
    <script src="js/features/areas/areas.js?v=20261114-nc1"></script>
    <script src="js/core/history.js?v=20261114-nc1"></script>
    <script src="js/core/sync.js?v=20261114-nc1"></script>
    <script src="js/features/auth/auth.js?v=20261114-nc1"></script>
    <script src="js/features/workspaces/workspaces.js?v=20261114-nc1"></script>
    <script src="js/features/workspaces/workspaces-ui.js?v=20261114-nc1"></script>
    <script src="js/features/media/media.js?v=20261114-nc1"></script>
    <script src="js/features/tags/tag-utils.js"></script>
    <script src="js/core/bootstrap.js?v=20261114-nc1"></script>
<script src="js/features/projects/projects.loader.js?v=20261114-nc2"></script>
<script src="js/layout/scrollbar.js?v=20261112-4"></script>


</body>
</html>
