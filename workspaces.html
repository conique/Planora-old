<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#111316"
    >

    <title>Planora | Workspaces</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/favicon.png"
    >

    <script>
        try {
            if (
                localStorage.getItem('Planora_tema') ===
                'claro'
            ) {
                document.documentElement.dataset.tema =
                    'claro';

                document.querySelector(
                    'meta[name="theme-color"]'
                ).content = '#f3f5f9';
            }
        } catch (e) {
            // Mantém o tema padrão.
        }
    </script>

    <link
        rel="stylesheet"
        href="css/main.css?v=20261114-3"
    >
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config/supabase.config.js"></script>
    <script src="js/core/storage.js?v=20261114-3"></script>
    <script src="js/features/areas/areas.js?v=20261114-1"></script>
    <script src="js/core/history.js?v=20261114-3"></script>
    <script src="js/core/sync.js?v=20261114-5"></script>
    <script src="js/features/auth/auth.js?v=20261114-4"></script>
    <script src="js/features/workspaces/workspaces.js?v=20261114-7"></script>
    <script src="js/features/workspaces/workspaces-ui.js?v=20261114-3"></script>
    <script src="js/features/media/media.js?v=20261114-1"></script>
    <script src="js/features/tags/tag-utils.js"></script>
    <script src="js/core/bootstrap.js?v=20261114-4"></script>
    <script src="js/layout/scrollbar.js?v=20261112-4"></script>
</body>
</html>
