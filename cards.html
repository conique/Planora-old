<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111316">
    <title>Planora — Timeline do projeto</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script>try{if(localStorage.getItem('Planora_tema')==='claro'){document.documentElement.dataset.tema='claro';document.querySelector('meta[name="theme-color"]').content='#f3f5f9'}}catch(e){}</script>
    <link rel="stylesheet" href="css/main.css?v=20261114-nc2">
</head>
<body>

    <header class="topo" id="topo" data-atual="" data-simples="true" data-acao="Criar card"></header>
<script src="js/layout/header.js?v=20261114-nc2"></script>
<div class="cabecalho-pagina">
        <a href="index.html" class="btn-voltar">‹</a>

        <h1 class="titulo-projeto" id="header-titulo">A carregar...</h1>
        <div class="cabecalho-meta-grupo cabecalho-meta-tags">
            <span class="tags-header" id="header-tags">
                <button type="button" class="btn-tag-mais pilula-prazo" id="btn-tag-mais" title="Adicionar tag" aria-label="Adicionar tag">+</button>
            </span>
            <span class="cabecalho-meta-separador" aria-hidden="true">·</span>
        </div>
        <div class="cabecalho-meta-grupo">
            <span class="selo selo-rotulo" id="header-status">Em andamento</span>
            <span class="cabecalho-meta-separador" aria-hidden="true">·</span>
        </div>
        <div class="cabecalho-meta-grupo">
            <span class="pilula-area" id="header-area"></span>
            <span class="cabecalho-meta-separador" aria-hidden="true">·</span>
        </div>
        <div class="cabecalho-meta-grupo">
            <span class="pilula-prazo" id="header-prazo" hidden></span>
            <button type="button" class="btn-editar-dados pilula-prazo" id="btn-editar-dados" title="Editar dados" aria-label="Editar dados">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
            </button>
        </div>

        <div class="painel-edicao" id="painel-edicao" hidden>
            <label>Título<input id="ed-nome" class="input-inline-tabela" maxlength="120" autocomplete="off"></label>
            <label>Rótulo<select id="ed-rotulo" class="select-inline-tabela"></select></label>
            <label>Área<select id="ed-area" class="select-inline-tabela"></select></label>
            <label>Prazo<input id="ed-prazo" type="date" class="input-inline-tabela"></label>
            <div class="ed-acoes">
                <button type="button" class="btn-ordem" id="ed-cancelar">Cancelar</button>
                <button type="button" class="btn-salvar-inline" id="ed-salvar">Salvar</button>
            </div>
        </div>
    </div>

    <div class="timeline-container">

        <!-- Formulário Novo Card -->
        <div class="form-novo-card" id="form-novo-card" hidden>

            <input
                type="text"
                class="input-titulo-card"
                id="inputTituloCard"
                onpaste="capturarCole(event)"
                placeholder="Novo card"
            >

            <textarea
                class="input-legenda-card"
                id="inputLegendaCard"
                onpaste="capturarCole(event)"
                placeholder="Escreva a legenda ou cole uma imagem/vídeo aqui (Ctrl+V)..."
                rows="3"
            ></textarea>

            <div id="container-preview-novo"></div>

            <div style="margin-top: 10px;">
                <label class="label-file" for="inputMidiaCard">
                    📁 Inserir Imagem/Vídeo
                </label>

                <input
                    type="file"
                    id="inputMidiaCard"
                    onchange="carregarArquivoTradicional(this)"
                    class="input-file-culto"
                    accept="image/*,video/*"
                >
            </div>

            <div class="acoes-novo-card">
                <button type="button" class="btn-cancelar-edicao" id="btnCancelarCard">Cancelar</button>
                <button
                    class="btn-enviar-card"
                    id="btnEnviarCard"
                    type="button"
                    onclick="adicionarCard()"
                >
                    Publicar card ↵
                </button>
            </div>

        </div>

        <!-- Feed -->
        <div id="feed-timeline"></div>

    </div>

    <footer class="footer-Planora">
    <span class="ponto"></span><strong>Planora</strong><span>© 2026</span>
    <span id="status-nuvem" class="status-nuvem" role="img" aria-label="Status da nuvem"></span>
    <span id="email-usuario" class="email-usuario"></span>
    <button type="button" class="btn-rodape" onclick="sairDaConta()">Sair</button>
</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config/supabase.config.js"></script>
    <script src="js/core/storage.js?v=20261114-nc1"></script>
    <script src="js/features/areas/areas.js?v=20261114-nc1"></script>
    <script src="js/core/history.js?v=20261114-nc1"></script>
    <script src="js/core/sync.js?v=20261114-nc1"></script>
    <script src="js/features/auth/auth.js?v=20261114-nc1"></script>
    <script src="js/features/workspaces/workspaces.js?v=20261114-nc1"></script>
    <script src="js/features/workspaces/workspaces-ui.js?v=20261114-nc1"></script>
    <script src="js/features/media/media.js?v=20261114-nc1"></script>
    <script src="js/features/tags/tag-utils.js"></script>
    <script src="js/core/bootstrap.js?v=20261114-nc1"></script>
<script src="js/features/cards/cards.loader.js?v=20261114-nc2"></script>
<script src="js/layout/scrollbar.js?v=20261112-4"></script>
</body>
</html>
